name: FraudMonitor
options:
  bundleIdPrefix: com.osintcaseops
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  FraudMonitorCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/FraudMonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osintcaseops.FraudMonitorCore
        GENERATE_INFOPLIST_FILE: YES
  FraudMonitor:
    type: application
    platform: iOS
    sources:
      - path: Sources/FraudMonitorApp
    dependencies:
      - target: FraudMonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osintcaseops.FraudMonitor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  FraudMonitor:
    build:
      targets:
        FraudMonitor: all
    run:
      config: Debug
