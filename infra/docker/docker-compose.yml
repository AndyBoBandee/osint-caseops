services:
  api:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /workspace/apps/api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      OSINT_CASEOPS_DATA_DIR: ${OSINT_CASEOPS_DATA_DIR:-/workspace/data}
      OSINT_CASEOPS_ENABLE_FIXTURE_PROVIDER: ${OSINT_CASEOPS_ENABLE_FIXTURE_PROVIDER:-}
      OSINT_CASEOPS_FRAUD_MONITOR_PROVIDERS: ${OSINT_CASEOPS_FRAUD_MONITOR_PROVIDERS:-gdelt,google_news_rss,hn_algolia}
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /workspace/apps/api/.venv-docker
    ports:
      - "8000:8000"
    volumes:
      - ../..:/workspace
      - api_venv:/workspace/apps/api/.venv-docker

  web:
    image: node:26-bookworm-slim
    working_dir: /workspace/apps/web
    command: sh -c "npm ci && npm run build && npm run start -- --hostname 0.0.0.0"
    environment:
      API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ../..:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  api_venv:
  web_node_modules:
