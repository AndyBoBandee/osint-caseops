services:
  api:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /workspace/apps/api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      OSINT_CASEOPS_DATA_DIR: /workspace/data
    ports:
      - "8000:8000"
    volumes:
      - ../..:/workspace

  web:
    image: node:26-bookworm-slim
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ../..:/workspace
    depends_on:
      - api
